services:
  - type: web
    name: mailroom-action-gate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker only: all evaluation/receipt state lives in memory.
    startCommand: uvicorn mailroom:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
